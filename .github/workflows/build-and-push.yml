name: Build and Push Docker Image

permissions:
  contents: read

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Derive GHCR image name and tag
      # ghcr.io requires lowercase image names (repo owner is mixed case),
      # and branch names may contain characters (e.g. '/') that are invalid in tags
      - name: Set image name and tag
        run: |
          echo "IMAGE_NAME=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/systemd-container" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$(echo "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_ENV"

      # 3. Set up QEMU for multi-architecture support
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build and Push Docker Image for multiple architectures
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          outputs: type=registry,oci-mediatypes=true,compression=estargz,force-compression=true
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max