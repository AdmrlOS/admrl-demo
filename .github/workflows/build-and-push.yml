name: Build and Push Docker Image

permissions: write-all

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Set up QEMU for multi-architecture support
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v4

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/systemd-container
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      # 4. Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and Push Docker Image for multiple architectures
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ github.ref == 'refs/heads/anpr-rk3588' && './Dockerfile.anpr' || './Dockerfile' }}
          outputs: type=registry,oci-mediatypes=true,compression=estargz,force-compression=true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
